name: Daily Podcast Pipeline

on:
  schedule:
    # UTC 22:17 = 北京时间次日 06:17，错峰避开整点排队，确保 07:00 前上架 Apple Podcasts
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "强制重跑当天写稿与音频合成（覆盖已有同日文件）"
        required: false
        type: boolean
        default: false
      target_date:
        description: "指定北京时间日期（YYYY-MM-DD，留空为今天）"
        required: false
        type: string
        default: ""
      skip_script:
        description: "跳过采集写稿，仅重新构建音频与 RSS"
        required: false
        type: boolean
        default: false
      channel:
        description: "频道配置文件路径（默认第一档每日开源播客）"
        required: false
        type: string
        default: "channels/daily-open-source.json"

permissions:
  contents: write

concurrency:
  group: daily-podcast-${{ inputs.channel || 'channels/daily-open-source.json' }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install system FFmpeg and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute Beijing date
        id: meta
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            EP_DATE="${{ inputs.target_date }}"
          else
            EP_DATE="$(TZ='Asia/Shanghai' date '+%Y-%m-%d')"
          fi
          echo "ep_date=${EP_DATE}" >> "$GITHUB_OUTPUT"
          echo "Target Beijing date: ${EP_DATE}"

      - name: Generate daily podcast script and show notes
        if: ${{ !inputs.skip_script }}
        env:
          REPO_DIR: ${{ github.workspace }}
          PODCAST_CHANNEL: ${{ inputs.channel || 'channels/daily-open-source.json' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WTL_API_KEY: ${{ secrets.WTL_API_KEY }}
          WTL_BASE_URL: ${{ vars.WTL_BASE_URL || 'https://hao.token6688.com' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(--date "${{ steps.meta.outputs.ep_date }}")
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS+=(--force)
          fi
          python scripts/generate_script.py "${ARGS[@]}"

      - name: Synthesize audio and rebuild RSS feed
        env:
          REPO_DIR: ${{ github.workspace }}
          PODCAST_CHANNEL: ${{ inputs.channel || 'channels/daily-open-source.json' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WTL_API_KEY: ${{ secrets.WTL_API_KEY }}
          WTL_BASE_URL: ${{ vars.WTL_BASE_URL || 'https://hao.token6688.com' }}
          WTL_DAILY_BUDGET_RMB: ${{ vars.WTL_DAILY_BUDGET_RMB || '3.0' }}
        run: |
          ARGS=()
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS+=(--force --only-stem "${{ steps.meta.outputs.ep_date }}")
          fi
          python scripts/daily_podcast_build.py "${ARGS[@]}"

      - name: Commit and push updated episode and RSS
        run: |
          git config user.name "daily-podcast-bot"
          git config user.email "actions@github.com"

          git add episodes/ history.md feed.xml index.html .state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No podcast changes to commit."
            exit 0
          fi

          git commit -m "chore(podcast): publish daily episode (${{ steps.meta.outputs.ep_date }})"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Successfully pushed podcast updates (attempt ${attempt})."
              exit 0
            fi
            echo "Push conflict or transient error on attempt ${attempt}, retrying..."
            sleep 5
          done
          echo "Failed to push after 3 attempts."
          exit 1

      - name: Notify on failure (optional webhook)
        if: failure()
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          EP_DATE: ${{ steps.meta.outputs.ep_date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NOTIFY_WEBHOOK_URL" ]; then
            echo "NOTIFY_WEBHOOK_URL is not configured; falling back to GitHub default email alerts."
            exit 0
          fi
          python - <<'PY'
          import os, requests

          url = os.environ["NOTIFY_WEBHOOK_URL"].strip()
          ep_date = os.environ.get("EP_DATE", "")
          run_url = os.environ.get("RUN_URL", "")
          text = f"【每日开源播客】云端自动流水线执行失败（日期：{ep_date}），请查看运行日志：{run_url}"

          if "open.feishu.cn" in url or "open.larksuite.com" in url:
              payload = {"msg_type": "text", "content": {"text": text}}
          elif "qyapi.weixin.qq.com" in url or "oapi.dingtalk.com" in url:
              payload = {"msgtype": "text", "text": {"content": text}}
          elif "api.telegram.org" in url:
              payload = {"text": text}
          else:
              payload = {"text": text, "content": text}

          try:
              r = requests.post(url, json=payload, timeout=15)
              print(f"Failure webhook sent: HTTP {r.status_code}")
          except Exception as e:
              print(f"Failure webhook error: {type(e).__name__}")
          PY
